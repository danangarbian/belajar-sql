### Pengantar SQL

Selamat datang! Ini adalah rangkaian pelajaran dan latihan interaktif yang dirancang untuk membantu Anda belajar SQL dengan cepat, langsung di dalam <i>browser</i> Anda.

#### Apa itu SQL?
SQL, atau <i>Structured Query Language</i>, adalah bahasa yang dirancang untuk memungkinkan pengguna teknis maupun non-teknis melakukan kueri, memanipulasi, dan mentransformasi data dari sebuah database relasional. 

**Tahukah Anda?**
Ada banyak database SQL populer termasuk SQLite, MySQL, Postgres, Oracle, dan Microsoft SQL Server. Semuanya mendukung standar bahasa SQL secara umum, yang merupakan materi yang akan diajarkan di situs ini.

#### Database Relasional
Sebelum mempelajari sintaks SQL, penting untuk memiliki gambaran mengenai apa sebenarnya database relasional itu. Database relasional merepresentasikan kumpulan tabel (dua dimensi) yang saling terkait. Setiap tabel mirip dengan lembar kerja (<i>spreadsheet</i>) Excel, dengan jumlah kolom bernama yang tetap.

Sebagai contoh, jika sebuah kampus memiliki database, Anda mungkin akan menemukan tabel yang berisi daftar riwayat penelitian. Tabel ini misalnya perlu menyimpan nama judul riset, ketua peneliti, tahun pelaksanaan, dan durasinya.

#### Tentang Pelajaran Ini
Setiap pelajaran akan memperkenalkan konsep yang berbeda dan diakhiri dengan latihan interaktif. Progres Anda akan **disimpan secara otomatis**, sehingga Anda dapat melanjutkannya kapan saja!

*(Silakan klik **Modul 1** di sidebar kiri untuk mulai menulis kueri pertama Anda!)*
                `

### Modul 1: Dasar Kueri SELECT

Untuk mengambil data dari database SQL, kita perlu menulis pernyataan **SELECT**, yang sering disebut sebagai <i>kueri</i> (query). Kueri pada dasarnya adalah pernyataan yang mendeklarasikan data apa yang kita cari, di mana menemukannya, dan bagaimana mentransformasikannya sebelum dikembalikan.

Kueri paling dasar yang bisa kita tulis adalah kueri yang memilih beberapa kolom dari sebuah tabel:

**Kueri memilih kolom tertentu:**
~~~sql
SELECT kolom1, kolom2 FROM nama_tabel;
~~~

Jika kita ingin mengambil <i>semua</i> kolom dari sebuah tabel, kita dapat menggunakan simbol bintang.
**Kueri memilih semua kolom:**
~~~sql
SELECT * FROM nama_tabel;
~~~

---
#### Latihan Interaktif
Kita akan menggunakan database berisi data **Penelitian Kampus**. Tabel yang digunakan bernama <code>Penelitian</code>. Silakan ubah kueri di editor bawah untuk menyelesaikan tugas-tugas di panel sebelah kanan!
                `,

### Modul 2: Kueri dengan Batasan (Bagian 1)

Sekarang kita tahu cara memilih kolom tertentu dari sebuah tabel. Tetapi jika Anda memiliki tabel dengan jutaan baris data, membaca seluruh baris tersebut akan sangat tidak efisien.

Untuk memfilter agar hanya hasil tertentu saja yang dikembalikan, kita perlu menggunakan klausa **WHERE** dalam kueri. Klausa ini diterapkan pada setiap baris data dengan memeriksa nilai kolom tertentu.

**Kueri SELECT dengan batasan (kondisi):**
~~~sql
SELECT kolom, kolom_lain 
FROM nama_tabel 
WHERE kondisi 
      AND/OR kondisi_lain;
~~~

Berikut adalah beberapa operator berguna yang dapat Anda gunakan untuk data numerik:
<ul>
<li><code>=</code>, <code>!=</code>, <code>&lt;</code>, <code>&lt;=</code>, <code>&gt;</code>, <code>&gt;=</code> (Operator standar)</li>
<li><code>BETWEEN ... AND ...</code> (Angka berada di rentang inklusif)</li>
<li><code>NOT BETWEEN ... AND ...</code></li>
<li><code>IN (...)</code> (Angka ada di dalam sebuah daftar, misal: <code>kolom IN (2, 4, 6)</code>)</li>
</ul>
                `,

                content: `
### Modul 3: Kueri dengan Batasan (Bagian 2)

Saat menulis klausa WHERE dengan kolom yang berisi data teks, SQL mendukung sejumlah operator yang berguna untuk melakukan hal-hal seperti perbandingan string tanpa memperhatikan besar/kecil huruf (case-insensitive) dan pencocokan pola menggunakan karakter <i>wildcard</i>. 

<ul>
<li><code>=</code> atau <code>!=</code> (Sama persis atau tidak sama)</li>
<li><code>LIKE</code> atau <code>NOT LIKE</code> (Perbandingan string case insensitive)</li>
<li><code>%</code> (Digunakan dengan LIKE untuk mencocokkan urutan karakter apa pun. Contoh: <code>LIKE "%AT%"</code>)</li>
<li><code>_</code> (Digunakan dengan LIKE untuk mencocokkan tepat satu karakter. Contoh: <code>LIKE "AN_"</code>)</li>
</ul>

**Tahukah Anda?**
Semua string teks harus diapit dengan tanda kutip tunggal atau ganda agar <i>parser</i> kueri dapat mengenalinya.
                `,

### Modul 4: Memfilter dan Mengurutkan Hasil Kueri

SQL menyediakan cara yang mudah untuk membuang baris duplikat dengan menggunakan kata kunci **DISTINCT**.

**Kueri SELECT dengan hasil unik**
~~~sql
SELECT DISTINCT kolom, kolom_lain FROM nama_tabel;
~~~

**Mengurutkan hasil**
SQL menyediakan cara untuk mengurutkan hasil Anda berdasarkan kolom tertentu dalam urutan menaik (<i>ascending</i>) atau menurun (<i>descending</i>) menggunakan klausa **ORDER BY**.

**Kueri SELECT dengan hasil yang diurutkan & dibatasi**
Klausa lain yang sering digunakan adalah **LIMIT** (membatasi jumlah baris) dan **OFFSET** (menentukan dari mana mulai menghitung).

~~~sql
SELECT kolom FROM nama_tabel 
ORDER BY kolom ASC/DESC 
LIMIT batas_jumlah OFFSET jumlah_offset;
~~~

                li.className = "task-item";
                
                if (i < currentTaskIndex) li.classList.add("done");
                else if (i === currentTaskIndex) li.classList.add("active");

                li.innerHTML = task.text;
                listEl.appendChild(li);
            });

            if(currentTaskIndex >= lesson.tasks.length) {
                document.getElementById("success-banner").style.display = "block";
                unlockNextLesson();
            }
        }

        function runQuery() {
            const query = document.getElementById("sql-input").value;
            const resultArea = document.getElementById("result-area");
            
            try {
                const res = db.exec(query);
                
                if (res.length > 0) {
                    renderTable(res, resultArea);
                } else {
                    resultArea.innerHTML = "<div class='success-msg'>✓ Sukses dieksekusi (Kueri manipulasi / Data kosong).</div>";
                }
                
                validateTask(res, query);
            } catch (err) {
                resultArea.innerHTML = "<div class='error-msg'>✖ Error: " + err.message + "</div>";
            }
        }

        function renderTable(resRaw, container) {
            let html = "<table><tr>";
            resRaw[0].columns.forEach(col => { html += "<th>" + col + "</th>"; });
            html += "</tr>";
            resRaw[0].values.forEach(row => {
                html += "<tr>";
                row.forEach(val => { html += "<td>" + (val === null ? "<i style='color:#94a3b8'>NULL</i>" : val) + "</td>"; });
                html += "</tr>";
            });
            html += "</table>";
            container.innerHTML = html;
        }

        function validateTask(userResRaw, userQuery) {
            const lesson = lessons[currentLessonIndex];
            if(!lesson.tasks || currentTaskIndex >= lesson.tasks.length) return;

            const expectedQuery = lesson.tasks[currentTaskIndex].expected;
            let isCorrect = false;

            const actionType = expectedQuery.trim().toUpperCase().split(" ")[0];
            
            if (actionType === "SELECT") {
                const shadowDb = new window.SQL.Database();
                if(lesson.setupDb) shadowDb.run(lesson.setupDb);
                
                try {
                    const expectedResRaw = shadowDb.exec(expectedQuery);
                    if (JSON.stringify(userResRaw) === JSON.stringify(expectedResRaw)) {
                        isCorrect = true;
                    }
                } catch(e) { console.log(e); }
                
            } else {
                const userQClean = userQuery.replace(/\s+/g, " ").trim().toLowerCase();
                const expQClean = expectedQuery.replace(/\s+/g, " ").trim().toLowerCase();
                if (userQClean.replace(/;$/, '') === expQClean.replace(/;$/, '')) {
                     isCorrect = true;
                }
            }

            if (isCorrect) {
                currentTaskIndex++; 
                renderTasks(); 
            }
        }

        function unlockNextLesson() {
            if (currentLessonIndex + 1 > maxUnlockedLessonIndex) {
                maxUnlockedLessonIndex = currentLessonIndex + 1;
                localStorage.setItem('dosenpx_sql_progress', maxUnlockedLessonIndex);
                renderSidebar(); 
            }
        }

        function nextLesson() {
            if(currentLessonIndex + 1 < lessons.length) {
                loadLesson(currentLessonIndex + 1);
            } else {
                alert("Selamat! Anda telah menyelesaikan seluruh modul pembelajaran ini.");
            }
        }

        function resetProgress() {
            if(confirm("Apakah Anda yakin ingin mereset semua progres belajar?")) {
                maxUnlockedLessonIndex = 1;
                localStorage.setItem('dosenpx_sql_progress', maxUnlockedLessonIndex);
                loadLesson(0);
            }
        }
    </script>
</body>
</html>
